[package]
name = "batnab"
version = "1.0.0"
description = "Batnab for Windows"
authors = ["Battushig"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# A small, fast program: the window only shows the website.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
