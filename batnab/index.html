<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batnab</title>
    <meta name="description" content="Batnab" />
    <meta name="theme-color" content="#0f0f0f" />
    <!-- The light look, if picked (lib/theme.ts), before anything is drawn. -->
    <script>
      try {
        var t = localStorage.getItem('batnab.theme');
        var ok = window.CSS && CSS.supports && CSS.supports('color', 'color-mix(in lab, red, red)');
        if (ok && (t === 'light' || (t === 'auto' && matchMedia('(prefers-color-scheme: light)').matches))) document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
    <!-- Installable as an app (Нүүр дэлгэцэд нэмэх). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Batnab" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236b86ff'/%3E%3Cstop offset='1' stop-color='%232f3fc9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M6.6 16.9 10.4 15.2 14.3 23.4 19.5 8.7H25.8' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='22.7' cy='16.9' r='2.55' fill='%23ffbf2e'/%3E%3C/svg%3E" />
    <!-- Warm up Firebase sign-in and the database. -->
    <link rel="preconnect" href="https://rgtbn-bb94f-default-rtdb.firebaseio.com" />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
