# The agent («Agent» in the teacher's dashboard) splits photographed book pages into problems. Every 5 minutes it
# takes the oldest request the topic editor sent («Agent-аар хуваах»): the pages come from the database, Claude reads
# them (it can only look at the pictures: no commands, no edits, no internet) and answers with each problem's number,
# its part of the page, its text and choices; that is kept for the teacher, who checks it and adds it to the topic.
# Nothing here changes the site's code. The repository and these logs are public: nothing read from the pages is
# printed (Claude's answer is read from its run's file, not from a step output).
# The schedule runs from the default branch (main), so this file must be there too; the code and the instructions
# (batnab/agents/split.md) come from the site's branch.
# Repository secrets: Claude's key, one of CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`: the owner's Claude plan,
# nothing more to pay) or ANTHROPIC_API_KEY (the API, paid apart); and FIREBASE_SERVICE_ACCOUNT_RGTBN_BB94F (as in
# batnab-deploy.yml). Repository variable (optional): AGENT_MODEL (Claude Code's "sonnet" when not set).
name: Batnab agent

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batnab-agent
  cancel-in-progress: false

env:
  SITE_BRANCH: claude/youtube-site-batnab-jfgjry

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the keys are set
        id: keys
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RGTBN_BB94F }}
          CLAUDE_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "db=true" >> "$GITHUB_OUTPUT"; else
            echo "::warning::Agent off: the repository secret FIREBASE_SERVICE_ACCOUNT_RGTBN_BB94F is not set."
            echo "db=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$CLAUDE_KEY" ]; then echo "claude=true" >> "$GITHUB_OUTPUT"; else
            echo "::warning::No pages are read: no Claude key (secret CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY; batnab/README.md, Agent)."
            echo "claude=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.keys.outputs.db == 'true'
        with:
          ref: ${{ env.SITE_BRANCH }}

      - uses: actions/setup-node@v5
        if: steps.keys.outputs.db == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: batnab/package-lock.json

      - if: steps.keys.outputs.db == 'true'
        working-directory: batnab
        run: npm ci --no-audit --no-fund

      - name: Take the next request
        id: plan
        if: steps.keys.outputs.db == 'true'
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RGTBN_BB94F }}
          CLAUDE: ${{ steps.keys.outputs.claude }}
          PAGES_DIR: ${{ github.workspace }}/.agent/pages
          PROMPT_FILE: ${{ github.workspace }}/.agent/split.md
        run: |
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node batnab/scripts/agent.mjs plan

      - name: Claude reads the pages
        id: read
        if: steps.plan.outputs.task != ''
        continue-on-error: true
        timeout-minutes: 12
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: claude,github-actions
          prompt: Read the file .agent/split.md and do what it says.
          settings: |
            {"permissions": {"allow": ["Read"], "deny": ["Bash", "Edit", "Write", "MultiEdit", "NotebookEdit", "WebFetch", "WebSearch", "Glob", "Grep", "Task", "Agent"]}}
          claude_args: |
            --model ${{ vars.AGENT_MODEL || 'sonnet' }}
            --max-turns 15
            --permission-mode default
            --json-schema '{"type":"object","properties":{"problems":{"type":"array","items":{"type":"object","properties":{"page":{"type":"integer"},"num":{"type":"integer"},"boxes":{"type":"array","items":{"type":"object","properties":{"x0":{"type":"integer"},"y0":{"type":"integer"},"x1":{"type":"integer"},"y1":{"type":"integer"}},"required":["x0","y0","x1","y1"],"additionalProperties":false}},"text":{"type":"string"},"choices":{"type":"object","properties":{"A":{"type":"string"},"B":{"type":"string"},"C":{"type":"string"},"D":{"type":"string"},"E":{"type":"string"}},"additionalProperties":false}},"required":["page","num","boxes","text"],"additionalProperties":false}}},"required":["problems"],"additionalProperties":false}'

      # Claude's answer is read from its run's file: a step output would show in the logs.
      - name: Keep what was read for the teacher
        if: steps.plan.outputs.task != ''
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RGTBN_BB94F }}
          ID: ${{ steps.plan.outputs.task }}
          EXEC: ${{ runner.temp }}/claude-execution-output.json
        run: |
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node batnab/scripts/agent.mjs saved "$ID"

      - name: Say what went wrong
        if: failure() && steps.plan.outputs.task != ''
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RGTBN_BB94F }}
          ID: ${{ steps.plan.outputs.task }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node batnab/scripts/agent.mjs fail "$ID" "Agent хуудсыг уншиж чадсангүй. Дахин оролдоно уу."
