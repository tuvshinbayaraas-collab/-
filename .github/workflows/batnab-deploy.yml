# Builds batnab/ and deploys it to Firebase (Hosting + Realtime Database rules)
# on every push that touches the site, then runs scripts/setup.mjs (sign-in
# provider, teacher account, default settings). Repository secrets:
#   FIREBASE_SERVICE_ACCOUNT_RGTBN_BB94F — the JSON key of a Google Cloud
#   service account with the "Firebase Admin" and "Service Usage Consumer" roles.
#   BATNAB_ADMIN_PASSWORD — the first password of the teacher account Admin
#   (only used to create it, or when the workflow is run by hand with
#   "reset_admin_password" ticked).
name: Deploy Batnab

on:
  push:
    branches: [main, claude/youtube-site-batnab-jfgjry]
    paths: ['batnab/**', '.github/workflows/batnab-deploy.yml']
  workflow_dispatch:
    inputs:
      reset_admin_password:
        description: Set the Admin password back to the BATNAB_ADMIN_PASSWORD secret
        type: boolean
        default: false

concurrency:
  group: batnab-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: batnab
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: batnab/package-lock.json

      - name: Check the deploy key is set
        id: key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RGTBN_BB94F }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::Deploy skipped: repository secret FIREBASE_SERVICE_ACCOUNT_RGTBN_BB94F is not set yet (see batnab/README.md, Автомат байршуулалт)."
            echo "### Deploy skipped — add the FIREBASE_SERVICE_ACCOUNT_RGTBN_BB94F secret" >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Deploy to Firebase
        if: steps.key.outputs.present == 'true'
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RGTBN_BB94F }}
          ADMIN_PASSWORD: ${{ secrets.BATNAB_ADMIN_PASSWORD }}
          RESET_ADMIN_PASSWORD: ${{ inputs.reset_admin_password }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15 deploy --only hosting,database --project rgtbn-bb94f --non-interactive
          node scripts/setup.mjs
          echo "### Deployed to https://batnab.web.app" >> "$GITHUB_STEP_SUMMARY"

      # The same site at a second address, https://11-6.web.app: its Hosting site is made the first time (when the name
      # is free and allowed), then deployed with the same files. A failure here leaves batnab.web.app as deployed above.
      - name: Also at 11-6.web.app
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RGTBN_BB94F }}
          SITE: '11-6'
        run: |
          trap 'rm -f "$RUNNER_TEMP/sa.json" firebase.extra.json' EXIT
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          if ! npx --yes firebase-tools@15 hosting:sites:list --project rgtbn-bb94f --json | grep -q "sites/$SITE\""; then
            if ! npx --yes firebase-tools@15 hosting:sites:create "$SITE" --project rgtbn-bb94f --non-interactive; then
              echo "### $SITE.web.app could not be made: the name is taken by another project or not allowed" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          # batnab.web.app's settings (files, rewrites, headers), for this site.
          node -e "const c=require('./firebase.json');const h=c.hosting.find((x)=>x.site==='batnab');require('fs').writeFileSync('firebase.extra.json',JSON.stringify({hosting:[{...h,site:process.env.SITE}]}))"
          npx --yes firebase-tools@15 deploy --only hosting --config firebase.extra.json --project rgtbn-bb94f --non-interactive
          echo "### Also at https://$SITE.web.app" >> "$GITHUB_STEP_SUMMARY"
